<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex"><title>Diagnóstico — Boxship PTY</title>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:32px auto;padding:0 16px;color:#111}
button{font-size:18px;padding:14px 24px;border:0;border-radius:10px;background:#0b2447;color:#fff;cursor:pointer}
.box{margin-top:20px;padding:16px;border-radius:10px;font-size:17px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.ok{background:#d4edda;color:#155724}.mal{background:#f8d7da;color:#721c24}.info{background:#e7f0ff;color:#0b2447}
code{background:#0001;padding:2px 6px;border-radius:4px}
</style></head><body>
<h1>Diagnóstico de seguimiento</h1>
<p>Pulsa el botón y tómale una captura a todo el resultado.</p>
<button id="go">Probar conexión</button>
<div id="out"></div>
<script>
const out=document.getElementById('out');
function add(cls,txt){const d=document.createElement('div');d.className='box '+cls;d.textContent=txt;out.appendChild(d)}
document.getElementById('go').onclick=async()=>{
  out.replaceChildren();
  // 1) ¿Qué script.js está publicado?
  try{
    const r=await fetch('script.js?x='+Date.now(),{cache:'no-store'}); const t=await r.text();
    const m=t.match(/TURNSTILE_SITE_KEY\s*=\s*'([^']*)'/);
    const key=m?m[1]:null;
    let k='No se encontró TURNSTILE_SITE_KEY en script.js';
    if(key!==null) k=key.startsWith('TU_')?'⚠ Site Key SIN configurar (todavía dice "'+key+'")':'Site Key: empieza con "'+key.slice(0,6)+'…" y tiene '+key.length+' caracteres';
    add('info','1) script.js publicado (HTTP '+r.status+')\n'+k+'\nVersión con diagnóstico: '+(t.includes('function debug(')?'sí (la del ZIP)':'NO (es otra versión)')+'\nUsa turnstile.ready(): '+(t.includes('turnstile.ready')?'SÍ ⚠ (esa versión da error)':'no'));
  }catch(e){add('mal','1) No se pudo leer script.js: '+e.message)}
  // 2) ¿Responde la función /tracking y está configurada?
  try{
    const r=await fetch('/tracking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tracking_id:'DIAGNOSTICO1'})});
    const t=await r.text(); let msg,cls='mal';
    if(r.status===500&&/no configurado/i.test(t)) msg='FALTA una variable en Cloudflare Pages: API_ACCESS_KEY o TURNSTILE_SECRET_KEY (o no se redesplegó después de crearlas). Revisa que estén en Production.';
    else if(r.status===403&&/requerida/i.test(t)){msg='✅ La función existe y las dos variables están configuradas. Esto es lo esperado.';cls='ok'}
    else if(r.status===404||t.trim().startsWith('<')) msg='Cloudflare no encontró la función. La carpeta "functions" con tracking.js debe estar en la raíz del repositorio.';
    else if(r.status===405) msg='La función responde, pero rechazó el método.';
    else msg='Respuesta distinta a la esperada. Mándame esta captura.';
    add(cls,'2) Función /tracking → HTTP '+r.status+'\n'+t.slice(0,300)+'\n\n'+msg);
  }catch(e){add('mal','2) No se pudo contactar /tracking: '+e.message)}
};
</script></body></html>
